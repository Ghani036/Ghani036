name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ghani036&theme=dark&hide_border=false&include_all_commits=true&count_private=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Ghani036&theme=dark&hide_border=false&include_all_commits=true&count_private=false&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate streak card
        run: |
          curl -fsSL "https://streak-stats.demolab.com/?user=Ghani036&theme=dark&hide_border=false" \
            -o profile/streak.svg
          if grep -qi "something went wrong\|unavailable\|error fetching" profile/streak.svg; then
            echo "Streak card generation failed"
            exit 1
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
